# libinput-gestures — touchpad gestures for StumpWM
# Requires: libinput-gestures installed, user in the `input` group, and the
# touchpad on the libinput driver (see /etc/X11/xorg.conf.d/90-touchpad.conf).
#
# Commands are sent to the running StumpWM via stumpish. gnext/gprev cycle
# through your groups: code -> web -> work -> music -> chat -> misc.

# 3-finger horizontal swipe = switch workspace (macOS "spaces" convention:
# swipe left moves to the space on the right = next group).
gesture swipe left  3   /home/kevin/.stumpwm.d/stumpwm-contrib/util/stumpish/stumpish gnext
gesture swipe right 3   /home/kevin/.stumpwm.d/stumpwm-contrib/util/stumpish/stumpish gprev

# 4-finger swipes do the same, in case you prefer 4 fingers for spaces.
gesture swipe left  4   /home/kevin/.stumpwm.d/stumpwm-contrib/util/stumpish/stumpish gnext
gesture swipe right 4   /home/kevin/.stumpwm.d/stumpwm-contrib/util/stumpish/stumpish gprev
