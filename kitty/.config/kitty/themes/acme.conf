# Acme Light Theme — Plan 9 acme: pale-yellow paper + black text.
# Heavier weight on purpose: dark-on-light reads thinner than light-on-dark,
# so the light theme uses the Medium weight for accessibility.

font_family             Comic Code Medium

cursor                  #000000
cursor_text_color       #FFFFEA

foreground              #000000
background              #FFFFEA

selection_foreground    #000000
selection_background    #C8DFC8

# Black (fg / dim text)
color0   #000000
color8   #5E5E4E

# Red
color1   #880000
color9   #AA0000

# Green
color2   #005500
color10  #006600

# Yellow (darkened for contrast)
color3   #5C5C00
color11  #706020

# Blue
color4   #1054AF
color12  #0066CC

# Magenta
color5   #555599
color13  #772277

# Cyan
color6   #007777
color14  #006666

# White
color7   #EFEFD8
color15  #FFFFEA

# Tab bar
active_tab_foreground   #000000
active_tab_background   #C8DFC8
inactive_tab_foreground #6E6E5E
inactive_tab_background #EFEFD8
