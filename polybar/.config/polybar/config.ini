;ont==========================================================
;
;   Polybar Configuration for EXWM
;   Optimized for dark mode visibility
;
;==========================================================

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0

[colors]
; Fleury theme colors (dark mode)
; Matching fleury-theme.el color palette
background = #020202
background-alt = #212121
foreground = #b99468
foreground-alt = #666666
primary = #f0c674
secondary = #2895c7
alert = #dc7575
underline = #fcaa05

; You can also use transparency: #AA1c1f26 (AA = transparency level)

[bar/exwm-panel]
; Size and position
width = 100%
height = 24
offset-x = 0
offset-y = 0
fixed-center = true
enable-ipc = true

; Colors
background = ${colors.background}
foreground = ${colors.foreground}

; Border
line-size = 2
line-color = ${colors.primary}
border-size = 0
border-color = #00000000

; Padding
padding-top = 2
padding-left = 2
padding-right = 2
module-margin = 1

; Fonts (numbered from 0)
; Font 0: Main text
font-0 = "Noto Sans Mono:size=11:weight=bold;2"
; Font 1: Fallback
font-1 = "DejaVu Sans:size=11;2"
; Font 2: Larger text for emphasis
font-2 = "Noto Sans Mono:size=12:weight=bold;2"

; Modules
modules-left = exwm-workspace
modules-center =
modules-right = cpu memory temperature battery date tray

; Misc
cursor-click = pointer
cursor-scroll = ns-resize

;==========================================================
; MODULES
;==========================================================

[module/exwm-workspace]
type = custom/ipc
; This hook is called by Emacs when workspace changes
hook-0 = emacsclient -e "(exwm-workspace-current-index)" 2>/dev/null | sed -e 's/^"//' -e 's/"$//' || echo "0"
initial = 1
format = <output>
format-prefix = "WS: "
format-prefix-foreground = ${colors.primary}
format-underline = ${colors.underline}
format-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = "CPU: "
format-prefix-foreground = ${colors.primary}
format-underline = ${colors.underline}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = "MEM: "
format-prefix-foreground = ${colors.primary}
format-underline = ${colors.underline}
label = %percentage_used%%

[module/temperature]
type = internal/temperature
; Thermal zone (check with: ls /sys/class/thermal/)
thermal-zone = 0
; Warning temperature
warn-temperature = 70

format = <label>
format-prefix = "TEMP: "
format-prefix-foreground = ${colors.primary}
format-underline = ${colors.underline}
format-warn = <label-warn>
format-warn-underline = ${colors.alert}

label = %temperature-c%
label-warn = %temperature-c%!
label-warn-foreground = ${colors.alert}

[module/battery]
type = internal/battery
; Use $ ls -1 /sys/class/power_supply/ to find your battery
battery = BAT0
adapter = AC
full-at = 98
time-format = %H:%M

; Formats
format-charging = <label-charging>
format-charging-prefix = "CHG: "
format-charging-prefix-foreground = ${colors.primary}
format-charging-underline = ${colors.underline}

format-discharging = <label-discharging>
format-discharging-prefix = "BAT: "
format-discharging-prefix-foreground = ${colors.primary}
format-discharging-underline = ${colors.underline}

format-full = <label-full>
format-full-prefix = "FULL: "
format-full-prefix-foreground = ${colors.primary}
format-full-underline = ${colors.underline}

label-charging = %percentage%% (%time%)
label-discharging = %percentage%% (%time%)
label-full = %percentage%%

[module/date]
type = internal/date
interval = 5

; Date format
date = %a %b %d
date-alt = %A, %B %d, %Y

; Time format (24-hour)
time = %H:%M
time-alt = %H:%M:%S

format-prefix =
format-prefix-foreground = ${colors.primary}
format-underline = ${colors.underline}

label = %date% %time%

[module/network]
type = internal/network
; Find your interface with: ip link
interface = wlan0
interval = 3.0

format-connected = <label-connected>
format-connected-underline = ${colors.underline}
label-connected = %essid% %local_ip%

format-disconnected = <label-disconnected>
format-disconnected-underline = ${colors.alert}
label-disconnected = disconnected
label-disconnected-foreground = ${colors.foreground-alt}

[module/tray]
type = internal/tray

; System tray icon size
tray-size = 75%

; Tray icon spacing
tray-spacing = 4px

; Tray background color for visibility in dark mode
tray-background = ${colors.background}

; Tray position in the module
tray-position = right

; Tray padding
tray-padding = 2

;==========================================================
; vim:ft=dosini
