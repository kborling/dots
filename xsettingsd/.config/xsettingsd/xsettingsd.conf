# xsettingsd — pushes font AA/hinting/DPI to GTK apps under a bare WM.
# Started from ~/.xinitrc. Reload without restart: `killall -HUP xsettingsd`.
Xft/Antialias 1
Xft/Hinting 1
Xft/HintStyle "hintslight"
Xft/RGBA "rgb"
Xft/lcdfilter "lcddefault"
# DPI is 1024 * dots-per-inch (96 * 1024 = 98304)
Xft/DPI 98304
Net/ThemeName "Adwaita-dark"
Net/IconThemeName "Adwaita"
Gtk/CursorThemeName "Adwaita"
